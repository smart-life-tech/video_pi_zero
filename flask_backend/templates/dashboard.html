<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Machine Monitor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">LIQUID LEVEL NETWORK</p>
        <h1>Machine monitor</h1>
      </div>
      <div class="controls">
        <label class="token-field">
          <span>Dashboard token</span>
          <input id="token" type="password" autocomplete="off" placeholder="Enter token">
        </label>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </header>

    <section class="summary" aria-label="Network summary">
      <div><strong id="total">0</strong><span>machines</span></div>
      <div><strong id="online">0</strong><span>online</span></div>
      <div><strong id="attention">0</strong><span>need attention</span></div>
      <p id="updated">Waiting for connection</p>
    </section>

    <p id="message" class="message" role="status">Enter the dashboard token to begin monitoring.</p>

    <section id="admin-panel" class="admin-panel" aria-label="Developer controls" hidden>
      <h2>Developer controls</h2>
      <div class="admin-grid">
        <form id="seed-form" class="admin-form">
          <h3>Create or update machine</h3>
          <label>
            <span>Machine ID</span>
            <input id="seed-machine-id" type="text" value="hw-000123" required>
          </label>
          <label>
            <span>Name</span>
            <input id="seed-name" type="text" value="Test Machine" required>
          </label>
          <label>
            <span>Device secret</span>
            <input id="seed-secret" type="text" value="MY_DEVICE_SECRET" required>
          </label>
          <label>
            <span>Key ID</span>
            <select id="seed-key-id">
              <option value="v1" selected>v1</option>
              <option value="v2">v2</option>
            </select>
          </label>
          <button type="submit">Create / update machine</button>
        </form>

        <form id="codes-form" class="admin-form">
          <h3>Generate pairing codes</h3>
          <label>
            <span>Machine ID</span>
            <input id="codes-machine-id" type="text" value="hw-000123" required>
          </label>
          <label>
            <span>Code count</span>
            <input id="codes-count" type="number" min="1" max="100" value="5" required>
          </label>
          <button type="submit">Generate codes</button>
        </form>
      </div>
      <pre id="admin-result" class="admin-result" aria-live="polite"></pre>
    </section>

    <section id="machines" class="machine-grid" aria-live="polite"></section>
  </main>
  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
